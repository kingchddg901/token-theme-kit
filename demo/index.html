<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>theme-kit — self-building editor demo</title>
    <style>
      body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0b0e12; color: #e6edf3; }
      .wrap { display: grid; grid-template-columns: 320px 1fr; gap: 24px; padding: 24px; max-width: 1100px; margin: 0 auto; }
      @media (max-width: 720px) { .wrap { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="editor"></div>
      <div id="preview"></div>
    </div>
    <!-- imports the REAL modules from ../src (serve with any static server) -->
    <script type="module" src="./demo.js"></script>
  </body>
</html>
